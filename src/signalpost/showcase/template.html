<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signalpost Profiles</title>
<meta name="description" content="Evidence-backed Norwegian company profiles. Every fact links to its source, retrieval time and content hash.">
<style>
:root{
  --bg:#f6f7f9;--surface:#ffffff;--surface-2:#f0f2f5;--text:#16202b;--muted:#5b6876;--border:#dfe3e8;
  --accent:#1f5fa8;--accent-soft:#e6eef8;--accent-text:#ffffff;
  --ok:#1d7a46;--ok-soft:#e3f3e9;--na:#6b7682;--na-soft:#eef0f2;--amb:#9a6200;--amb-soft:#fbf0d9;
  --blk:#b4431b;--blk-soft:#fbe7df;--fail:#b3261e;--fail-soft:#fbe4e2;--napp:#57606a;--napp-soft:#eceef0;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --radius:12px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f141a;--surface:#161c24;--surface-2:#1d252f;--text:#e6ebf0;--muted:#9aa6b2;--border:#2a333e;
  --accent:#6aa6ec;--accent-soft:#1c2c40;--accent-text:#0f141a;
  --ok:#5cc98a;--ok-soft:#173326;--na:#9aa6b2;--na-soft:#222a33;--amb:#e9b04f;--amb-soft:#3a2d12;
  --blk:#f08a62;--blk-soft:#3a2118;--fail:#f2867e;--fail-soft:#3b1d1b;--napp:#a6b0ba;--napp-soft:#242c35;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f141a;--surface:#161c24;--surface-2:#1d252f;--text:#e6ebf0;--muted:#9aa6b2;--border:#2a333e;
  --accent:#6aa6ec;--accent-soft:#1c2c40;--accent-text:#0f141a;
  --ok:#5cc98a;--ok-soft:#173326;--na:#9aa6b2;--na-soft:#222a33;--amb:#e9b04f;--amb-soft:#3a2d12;
  --blk:#f08a62;--blk-soft:#3a2118;--fail:#f2867e;--fail-soft:#3b1d1b;--napp:#a6b0ba;--napp-soft:#242c35;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
.top-in{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:17px;color:var(--text)}
.brand svg{width:26px;height:26px}
nav.tabs{display:flex;gap:2px;flex-wrap:wrap}
nav.tabs a{padding:7px 11px;border-radius:8px;color:var(--muted);font-weight:500;min-height:36px;display:inline-flex;align-items:center}
nav.tabs a.on,nav.tabs a:hover{background:var(--accent-soft);color:var(--accent);text-decoration:none}
.grow{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:0 10px;min-width:220px;flex:0 1 320px}
.search input{border:0;background:transparent;color:var(--text);font:inherit;padding:8px 0;width:100%;outline:none}
.iconbtn{border:1px solid var(--border);background:var(--surface);border-radius:10px;min-width:40px;min-height:40px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
main{max-width:1200px;margin:0 auto;padding:20px 16px 80px}
h1{font-size:26px;line-height:1.2;margin:0 0 6px}h2{font-size:18px;margin:0 0 12px}h3{font-size:15px;margin:0 0 8px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--mono);font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}.kpi .l{color:var(--muted);font-size:13px}
.hero{padding:22px 0 10px}.hero p{max-width:760px;color:var(--muted);margin:6px 0 16px}
.bigsearch{display:flex;gap:8px;max-width:640px}
.bigsearch input{flex:1;font:inherit;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text)}
.btn{background:var(--accent);color:var(--accent-text);border:0;border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer;min-height:40px}
.btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-available{background:var(--ok-soft);color:var(--ok)}.st-not_available{background:var(--na-soft);color:var(--na)}
.st-ambiguous{background:var(--amb-soft);color:var(--amb)}.st-blocked{background:var(--blk-soft);color:var(--blk)}
.st-failed{background:var(--fail-soft);color:var(--fail)}.st-not_applicable{background:var(--napp-soft);color:var(--napp)}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;background:var(--surface-2)}
.bar>span{display:block;height:100%}
.b-available{background:var(--ok)}.b-not_available{background:color-mix(in srgb,var(--na) 45%,transparent)}.b-ambiguous{background:var(--amb)}
.b-blocked{background:var(--blk)}.b-failed{background:var(--fail)}.b-not_applicable{background:color-mix(in srgb,var(--napp) 30%,transparent)}
.covrow{display:grid;grid-template-columns:170px 1fr 52px;gap:10px;align-items:center;padding:5px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:12.5px;color:var(--muted);font-weight:600;white-space:nowrap;cursor:pointer;user-select:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tbody tr:hover{background:var(--surface-2)}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:140px}
.dot{width:9px;height:9px;border-radius:3px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);min-height:40px}
.co-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-top:14px}
.fact{background:var(--surface-2);border-radius:10px;padding:10px 12px}.fact .v{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}.fact .l{font-size:12.5px;color:var(--muted)}
.brief p{margin:0 0 8px}
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-left:3px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);font-size:11px;font-weight:700;color:var(--accent);cursor:pointer;vertical-align:2px}
.cite:hover{background:var(--accent-soft)}
.section{margin-top:18px}
.statusstrip{display:flex;gap:6px;flex-wrap:wrap}
dl.kv{display:grid;grid-template-columns:minmax(150px,240px) 1fr;margin:0}
dl.kv dt,dl.kv dd{padding:8px 0;border-bottom:1px solid var(--border);margin:0}
dl.kv dt{color:var(--muted);font-size:13.5px;padding-right:10px}
dl.kv dd{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.src{flex:none;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:2px 8px;font-size:12px;color:var(--muted);cursor:pointer;min-height:28px}
.src:hover{color:var(--accent);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.item .t{font-weight:600}
.unknown{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--border)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fin-wrap{overflow-x:auto}
.fin td button{all:unset;cursor:pointer;font-variant-numeric:tabular-nums}.fin td button:hover{color:var(--accent);text-decoration:underline}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 12px;cursor:pointer;min-height:34px}.seg button.on{background:var(--accent);color:var(--accent-text)}
.timeline{border-left:2px solid var(--border);margin-left:6px;padding-left:14px}
.tl{position:relative;padding:6px 0 10px}.tl:before{content:"";position:absolute;left:-20px;top:12px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
#drawer{position:fixed;top:0;right:0;height:100%;width:min(520px,100%);background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 30px rgba(0,0,0,.15);transform:translateX(105%);transition:transform .2s ease;z-index:50;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--border)}
#drawer .body{overflow:auto;padding:16px}
.ev{border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
.span{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);border-left:3px solid var(--accent);padding:8px 10px;border-radius:6px;white-space:pre-wrap;word-break:break-word;margin:8px 0}
.evrow{display:grid;grid-template-columns:110px 1fr;gap:6px;font-size:13px;padding:3px 0}
.evrow span:first-child{color:var(--muted)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:40;display:none}.scrim.open{display:block}
.empty{padding:30px;text-align:center;color:var(--muted)}
.cmp th{position:sticky;top:0;background:var(--surface)}
.pill{display:inline-block;padding:1px 7px;border-radius:6px;background:var(--surface-2);font-size:12px;color:var(--muted)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:60}
.toast.on{opacity:1}
@media (max-width:760px){
  .two{grid-template-columns:1fr}
  dl.kv{grid-template-columns:1fr}dl.kv dt{border-bottom:0;padding-bottom:0}
  .covrow{grid-template-columns:110px 1fr 44px}
  table.resp thead{display:none}
  table.resp tr{display:block;border:1px solid var(--border);border-radius:12px;margin-bottom:10px;background:var(--surface);padding:6px 4px}
  table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 10px;text-align:right}
  table.resp td:before{content:attr(data-l);color:var(--muted);font-size:12.5px;text-align:left}
  table.resp td.first{display:block;text-align:left}table.resp td.first:before{content:none}
  #drawer{top:auto;bottom:0;height:85%;width:100%;border-left:0;border-top:1px solid var(--border);border-radius:16px 16px 0 0;transform:translateY(105%)}
  #drawer.open{transform:none}
  .search{flex:1 1 100%;order:3}
  h1{font-size:22px}
}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <a class="brand" href="#/" aria-label="Signalpost home">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="8" fill="var(--accent)"/><path d="M10 21c3-6 9-6 12-12" stroke="var(--accent-text)" stroke-width="2.6" fill="none" stroke-linecap="round"/><circle cx="10" cy="21" r="2.6" fill="var(--accent-text)"/><circle cx="22" cy="9" r="2.6" fill="var(--accent-text)"/></svg>
    Signalpost</a>
  <nav class="tabs" aria-label="Sections">
    <a href="#/" data-r="">Overview</a><a href="#/companies" data-r="companies">Companies</a><a href="#/changes" data-r="changes">Changes</a>
    <a href="#/compare" data-r="compare">Compare <span id="cmpn"></span></a><a href="#/method" data-r="method">Method</a>
  </nav>
  <div class="grow"></div>
  <label class="search"><span aria-hidden="true">⌕</span><input id="q" type="search" placeholder="Org. number or company name" aria-label="Search companies"></label>
  <button class="iconbtn" id="theme" aria-label="Toggle colour theme" title="Toggle theme">◐</button>
</div></header>
<main id="app" tabindex="-1"></main>
<div class="scrim" id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Evidence"><header><strong id="dtitle">Evidence</strong><button class="iconbtn" id="dclose" aria-label="Close evidence">✕</button></header><div class="body" id="dbody"></div></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const BOOT = /*__BOOT__*/null;
(function(){
"use strict";
const INDEX = (BOOT && BOOT.index) || [], REPORT = (BOOT && BOOT.report) || {};
const BYORG = Object.fromEntries(INDEX.map(r => [r.o, r]));
const FAM = [["identity","Legal identity"],["status","Registry status"],["industry","Industry"],["financials","Annual accounts"],["leadership","Leadership & roles"],["locations","Registered workplaces"],["group","Group structure"],["website","Official website"],["social_profiles","Company-owned profiles"],["contact","Contact"],["description","Self-description"],["jobs","Job postings"],["activity","Dated activity"]];
const FAML = Object.fromEntries(FAM);
const STATES = ["available","not_available","ambiguous","blocked","failed","not_applicable"];
const STL = {available:"Available",not_available:"Not available",ambiguous:"Ambiguous",blocked:"Blocked",failed:"Failed",not_applicable:"Not applicable"};
const STI = {available:"✓",not_available:"–",ambiguous:"?",blocked:"⛔",failed:"✕",not_applicable:"∅"};
const SRC = {official_registry:"Official registry",official_registry_bulk:"Registry snapshot",company_owned:"Company-owned site",public_api:"Public API",open_data:"Open data"};
const cache = {}, waiters = {};
const nf = new Intl.NumberFormat("nb-NO");
// ---------------------------------------------------------------- helpers
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if (props) for (const [k,v] of Object.entries(props)){
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (k === "href") n.setAttribute("href", safeHref(v)); else n.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) n.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return n;
}
function safeHref(u){ u = String(u||""); return /^(https?:|#|mailto:|data\/)/i.test(u) ? u : "#"; }
function ext(u, label){ return el("a",{href:u,target:"_blank",rel:"noopener noreferrer nofollow"}, label || u); }
function chip(state, label){ return el("span",{class:"chip st-"+state,title:STL[state]||state}, el("span",{"aria-hidden":"true"},STI[state]||"•"), label || STL[state] || state); }
function num(v){ return (typeof v === "number") ? nf.format(v) : String(v); }
function money(v, unit){
  if (typeof v !== "number") return v == null ? "—" : String(v);
  const a = Math.abs(v); let s;
  if (a >= 1e9) s = (v/1e9).toLocaleString("nb-NO",{maximumFractionDigits:1})+" mrd"; else if (a >= 1e6) s = (v/1e6).toLocaleString("nb-NO",{maximumFractionDigits:1})+" mill"; else s = nf.format(v);
  return s + " " + (unit || "NOK");
}
function fmtOrg(o){ return o ? o.replace(/(\d{3})(\d{3})(\d{3})/,"$1 $2 $3") : ""; }
function toast(t){ const n = document.getElementById("toast"); n.textContent = t; n.classList.add("on"); setTimeout(()=>n.classList.remove("on"), 1600); }
function copy(t){ try { navigator.clipboard.writeText(t).then(()=>toast("Copied")); } catch(e) { toast("Copy not available"); } }
function store(k, v){ try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || "null"); localStorage.setItem(k, JSON.stringify(v)); } catch(e) { return null; } }
function valueText(v){
  if (v == null) return "—";
  if (typeof v === "object"){
    if (v.title) return v.title + (v.location ? " · " + v.location : "") + (v.date ? " · " + v.date : "") + (v.published ? " · published " + v.published : "");
    if (v.name) return v.name + (v.organisation_number ? " (" + fmtOrg(v.organisation_number) + ")" : "") + (v.relation ? " · " + v.relation : "") + (v.share ? " " + v.share : "");
    return JSON.stringify(v);
  }
  return typeof v === "number" ? num(v) : String(v);
}
// ---------------------------------------------------------------- data loading
window.SP_LOAD = function(org, data){ data.claims = (data.claims||[]).filter(c => (c.availability||"available") === "available"); cache[org] = data; (waiters[org]||[]).forEach(f => f(data)); delete waiters[org]; };
function load(org){
  if (cache[org]) return Promise.resolve(cache[org]);
  return new Promise((resolve, reject) => {
    (waiters[org] = waiters[org] || []).push(resolve);
    if (waiters[org].length > 1) return;
    const s = document.createElement("script"); s.src = "data/" + org + ".js"; s.async = true;
    s.onerror = () => { delete waiters[org]; reject(new Error("missing profile")); };
    document.head.append(s);
  });
}
// ---------------------------------------------------------------- compare set
let CMP = (store("sp-compare") || []).filter(o => BYORG[o]);
function setCmp(list){ CMP = list.slice(0,4); store("sp-compare", CMP); document.getElementById("cmpn").textContent = CMP.length ? "("+CMP.length+")" : ""; }
function toggleCmp(o){ setCmp(CMP.includes(o) ? CMP.filter(x => x !== o) : CMP.concat(o)); if (CMP.length === 4) toast("Comparing up to 4 companies"); }
setCmp(CMP);
// ---------------------------------------------------------------- evidence drawer
const drawer = document.getElementById("drawer"), scrim = document.getElementById("scrim");
function closeDrawer(){ drawer.classList.remove("open"); scrim.classList.remove("open"); drawer.setAttribute("aria-hidden","true"); }
document.getElementById("dclose").onclick = closeDrawer; scrim.onclick = closeDrawer;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
function openEvidence(env, claimIds, title){
  const claims = env.claims.filter(c => claimIds.includes(c.id));
  const evs = Object.fromEntries(env.evidence.concat(env.prior_evidence || []).map(e => [e.id, e]));
  const body = document.getElementById("dbody"); body.replaceChildren();
  document.getElementById("dtitle").textContent = title || "Evidence";
  claims.forEach(c => {
    body.append(el("div",{class:"small muted"}, (FAML[c.family]||c.family) + " · " + (c.label || c.field)));
    body.append(el("div",{style:"font-weight:700;margin:2px 0 8px"}, valueText(c.value) + (c.unit && typeof c.value === "number" ? " " + c.unit : "")));
    const meta = [];
    if (c.period && c.period.to) meta.push("Reporting period " + (c.period.from || "?") + " → " + c.period.to);
    if (c.effective_date) meta.push("Effective " + c.effective_date);
    if (c.stale_since) meta.push("Carried forward (source unreadable since " + c.stale_since + ")");
    if (c.derived) meta.push("Derived value");
    if (meta.length) body.append(el("div",{class:"small muted",style:"margin-bottom:8px"}, meta.join(" · ")));
    c.evidence_ids.forEach(id => {
      const e = evs[id]; if (!e) return;
      body.append(el("div",{class:"ev"},
        el("div",{style:"display:flex;justify-content:space-between;gap:8px;align-items:center"}, el("span",{class:"pill"}, SRC[e.source_class] || e.source_class), e.license ? el("span",{class:"small muted"}, e.license) : null),
        el("div",{class:"span"}, e.claim_span || "(no span)"),
        el("div",{class:"evrow"}, el("span",null,"Source"), ext(e.source_url, e.source_url.length > 70 ? e.source_url.slice(0,70)+"…" : e.source_url)),
        el("div",{class:"evrow"}, el("span",null,"Retrieved"), el("span",null, e.retrieved_at)),
        e.reporting_period && e.reporting_period.to ? el("div",{class:"evrow"}, el("span",null,"Period"), el("span",null, (e.reporting_period.from||"")+" → "+e.reporting_period.to)) : null,
        el("div",{class:"evrow"}, el("span",null,"Method"), el("span",{class:"mono"}, e.extraction_method)),
        e.identity_reason ? el("div",{class:"evrow"}, el("span",null,"Identity"), el("span",null, e.identity_reason)) : null,
        el("div",{class:"evrow"}, el("span",null,"SHA-256"), el("span",null, el("span",{class:"mono"}, e.content_sha256.slice(0,16)+"…"), " ", el("button",{class:"src",onclick:()=>copy(e.content_sha256)},"Copy"))),
      ));
    });
  });
  if (!claims.length) body.append(el("p",{class:"muted"},"No claims referenced."));
  drawer.classList.add("open"); scrim.classList.add("open"); drawer.setAttribute("aria-hidden","false");
  document.getElementById("dclose").focus();
}
function srcBtn(env, claim){
  const e = env.evidence.find(x => x.id === claim.evidence_ids[0]) || {};
  return el("button",{class:"src",title:"Show evidence",onclick:()=>openEvidence(env,[claim.id], claim.label)}, (SRC[e.source_class]||"Source") + " · " + String(e.retrieved_at||"").slice(0,10));
}
// ---------------------------------------------------------------- router
const app = document.getElementById("app");
function route(){
  const h = location.hash.replace(/^#\/?/,"");

// ---------------------------------------------------------------- compare
async function viewCompare(arg){
  if (arg) setCmp(arg.split(",").filter(o => BYORG[o]));
  app.append(el("h1",null,"Compare companies"));
  if (!CMP.length){ app.append(el("div",{class:"card empty"},"Add up to four companies with “Add” in the company list or “+ Compare” on a profile.")); return; }
  const envs = await Promise.all(CMP.map(o => load(o).catch(()=>null)));

    ["Legal form", e => (first(e,"legal_form")||{}).value], ["Municipality", e => (first(e,"municipality")||{}).value], ["Founded", e => (first(e,"founded_date")||{}).value],
    ["Industry", e => (first(e,"industry_code")||{}).value], ["Employees", e => first(e,"employees") ? num(first(e,"employees").value) : null],
    ["Revenue", e => { const f=latestFin(e).revenue; return f ? money(f.value,f.unit)+" ("+f.period.to.slice(0,4)+")" : null; }],
    ["Operating result", e => { const f=latestFin(e).operating_result; return f ? money(f.value,f.unit) : null; }],
    ["Net result", e => { const f=latestFin(e).net_result; return f ? money(f.value,f.unit) : null; }],
    ["Equity", e => { const f=latestFin(e).equity; return f ? money(f.value,f.unit) : null; }],
    ["Total assets", e => { const f=latestFin(e).total_assets; return f ? money(f.value,f.unit) : null; }],
    ["CEO", e => (first(e,"ceo")||{}).value], ["Board chair", e => (first(e,"board_chair")||{}).value],
    ["Workplaces", e => String(claimsOf(e,"locations").length)], ["Website", e => (first(e,"official_website")||{}).value],
    ["Active jobs", e => String(claimsOf(e,"jobs").length)], ["Facts published", e => String(e.claims.length)],
  ];
  const t = el("table",{class:"cmp"}, el("thead",null, el("tr",null, el("th",null,""), envs.map((e,i) => el("th",null, e ? el("a",{href:"#/c/"+CMP[i]}, e.name) : CMP[i], " ", el("button",{class:"src",onclick:()=>{toggleCmp(CMP[i]); route();},"aria-label":"Remove"},"✕"))))));
  const tb = el("tbody");
  rows.forEach(([l,f]) => tb.append(el("tr",null, el("td",{class:"muted"},l), envs.map(e => el("td",null, e ? (f(e) || "—") : "—")))));
  FAM.forEach(([fam,l]) => tb.append(el("tr",null, el("td",{class:"muted"}, l), envs.map(e => el("td",null, e ? chip((e.availability[fam]||{}).state||"failed") : "—")))));
  t.append(tb);
  app.append(el("div",{class:"card fin-wrap"}, t), el("p",{class:"small muted"},"Share this comparison: ", el("a",{href:"#/compare/"+CMP.join(",")}, location.href.split("#")[0]+"#/compare/"+CMP.join(","))));
}
// ---------------------------------------------------------------- changes
function viewChanges(){
  app.append(el("h1",null,"Changes since the previous run"));
  const rows = INDEX.flatMap(r => (r.ch||[]).map(c => ({...c, o:r.o, n:r.n})));
  if (!rows.length){ app.append(el("div",{class:"card"}, el("p",null, REPORT.mode === "refresh" ? "The refresh found no material changes. Re-running on the same sources is idempotent: zero false changes." : "This is a baseline run. Run again with --previous <this run> to detect new filings, role changes, new or closed jobs, address changes and more. Prior evidence is preserved and sources that cannot be read are carried forward, never reported as removed."))); return; }
  const types = {}; rows.forEach(r => types[r.t] = (types[r.t]||0)+1);
  app.append(el("div",{class:"legend",style:"margin-bottom:12px"}, Object.entries(types).map(([t,n]) => el("span",{class:"pill"}, t.replace(/_/g," ")+" · "+n))));

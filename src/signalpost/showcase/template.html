<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Signalpost Profiles</title>
<meta name="description" content="Evidence-backed Norwegian company profiles. Every fact links to its source, retrieval time and content hash.">
<meta name="color-scheme" content="light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23285A80'/%3E%3Cpath d='M9 22c3.5-7 10.5-7 14-13' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='9' cy='22' r='2.6' fill='white'/%3E%3Ccircle cx='23' cy='9' r='2.6' fill='white'/%3E%3C/svg%3E">
<style>
/* Tokens: see DESIGN.md §2. Light = "Birch", dark = "Polar night". */
:root{
  --canvas:#F7F6F3;--surface:#FFFFFF;--surface-2:#F1EFEA;--surface-3:#E9E6E0;--line:#E4E1DA;--line-strong:#D2CEC5;
  --ink:#1C1B19;--ink-2:#55524C;--ink-3:#6E6A63;
  --accent:#285A80;--accent-hover:#1F4A6B;--accent-soft:#E3ECF3;--on-accent:#FFFFFF;
  --ok:#2F6B3A;--ok-soft:#E7F0E6;--ok-fill:#3E8A4C;
  --na:#5F5B54;--na-soft:#EEECE7;--na-fill:#BDB8AE;
  --amb:#7F5300;--amb-soft:#F8EED3;--amb-fill:#B07A10;
  --blk:#984519;--blk-soft:#F7E6DA;--blk-fill:#C2662F;
  --fail:#A3302C;--fail-soft:#F8E3E1;--fail-fill:#C2413B;
  --napp:#625E57;--napp-soft:#F1EFEA;--napp-fill:#D2CEC5;
  --shadow-overlay:0 12px 32px -12px rgba(41,36,28,.22),0 0 0 1px rgba(41,36,28,.06);
  --sans:"SF Pro Text","SF Pro Display","Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"SF Mono","Cascadia Mono","JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.7,.2,1);
  --z-sticky:10;--z-pop:20;--z-scrim:30;--z-drawer:40;--z-toast:50;
  --glass:rgba(255,255,255,.70);--glass-strong:rgba(255,255,255,.84);--glass-border:rgba(255,255,255,.80);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 10px 30px -14px rgba(31,74,107,.22),0 2px 6px -3px rgba(31,74,107,.10);
  --blur:saturate(170%) blur(18px);--amb-1:rgba(40,90,128,.30);--amb-2:rgba(46,140,150,.22);--amb-3:rgba(233,190,140,.42);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --canvas:#141412;--surface:#1B1B19;--surface-2:#232320;--surface-3:#2C2C29;--line:#2E2E2B;--line-strong:#3D3D39;
  --ink:#EDEBE6;--ink-2:#BDB9B0;--ink-3:#9A968D;
  --accent:#8DB8DC;--accent-hover:#A6C8E5;--accent-soft:#1F2A33;--on-accent:#10161B;
  --ok:#8CCB95;--ok-soft:#1C2A1E;--ok-fill:#5DAA69;--na:#B5B0A7;--na-soft:#262623;--na-fill:#55534D;
  --amb:#E3B65C;--amb-soft:#2E2614;--amb-fill:#C99A3E;--blk:#E79A6C;--blk-soft:#2F2119;--blk-fill:#C77748;
  --fail:#EE8F88;--fail-soft:#321D1B;--fail-fill:#D25A52;--napp:#A29E95;--napp-soft:#232320;--napp-fill:#3D3D39;
  --shadow-overlay:0 12px 32px -12px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06);color-scheme:dark;
  --glass:rgba(32,33,31,.62);--glass-strong:rgba(32,33,31,.82);--glass-border:rgba(255,255,255,.09);
  --glass-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 14px 34px -14px rgba(0,0,0,.65);
  --amb-1:rgba(141,184,220,.18);--amb-2:rgba(93,170,150,.12);--amb-3:rgba(201,154,62,.12);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;min-height:100dvh;background:var(--canvas);color:var(--ink);font:400 15px/1.6 var(--sans);font-feature-settings:"ss01","cv11"}
a{color:var(--accent);text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{text-wrap:balance;margin:0}
p{text-wrap:pretty}
h1{font-size:clamp(24px,3vw,32px);line-height:1.15;font-weight:650;letter-spacing:-.02em}
h2{font-size:19px;line-height:1.3;font-weight:620;letter-spacing:-.01em}
h3{font-size:14px;line-height:1.4;font-weight:600}
.eyebrow{font-size:12px;line-height:1.3;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}.small{font-size:13px;line-height:1.45}
.mono{font-family:var(--mono);font-size:12.5px}
.num,.tnum{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:12px;top:-60px;background:var(--accent);color:var(--on-accent);padding:10px 14px;border-radius:6px;z-index:var(--z-toast)}
.skip:focus{top:10px}
kbd{font-family:var(--mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:4px;padding:1px 6px;color:var(--ink)}
mark{background:color-mix(in srgb,var(--amb-fill) 30%,transparent);color:inherit;border-radius:2px;padding:0 1px}

/* ---------------------------------------------------------------- top bar */
.top{position:sticky;top:0;z-index:var(--z-sticky);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:saturate(140%) blur(8px);-webkit-backdrop-filter:saturate(140%) blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 24px;min-height:56px;display:flex;gap:16px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:16px;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
.brand:hover{text-decoration:none}
.brand svg{width:24px;height:24px;flex:none}
nav.tabs{display:flex;gap:2px;align-self:stretch}
nav.tabs a{position:relative;display:inline-flex;align-items:center;gap:6px;padding:0 10px;color:var(--ink-2);font-weight:500;font-size:14px;white-space:nowrap}
nav.tabs a:hover{color:var(--ink);text-decoration:none}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"]:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.count{font-size:11.5px;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:0 6px;line-height:18px}
.grow{flex:1}
.searchbox{position:relative;flex:0 1 300px;min-width:200px}
.searchbox input{width:100%;height:36px;border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:0 34px 0 32px;outline:none;transition:border-color .15s var(--ease)}
.searchbox input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.searchbox .ico{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3);pointer-events:none}
.searchbox kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);pointer-events:none}
.tools{display:flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 10px;min-height:32px;font-size:13px;font-weight:500;color:var(--ink-2);transition:background .15s var(--ease)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.seg button:hover{color:var(--ink)}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:34px;min-height:34px;padding:0 8px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);color:var(--ink-2);font-size:13px;transition:background .15s var(--ease),color .15s var(--ease)}
.iconbtn:hover{background:var(--surface-2);color:var(--ink)}
.iconbtn svg{width:16px;height:16px}

/* ---------------------------------------------------------------- layout */
main{max-width:1240px;margin:0 auto;padding:28px 24px 96px}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.page-head p{margin:6px 0 0;max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px}
.panel>h2,.panel>.ph{margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2,.ph h3{margin:0}
.stack{display:grid;gap:16px}
.section{margin-top:32px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;align-items:start}
.split{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:start}
.rule{border:0;border-top:1px solid var(--line);margin:16px 0}

/* ---------------------------------------------------------------- buttons & inputs */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:0 14px;border-radius:6px;border:1px solid transparent;font-weight:550;font-size:14px;white-space:nowrap;transition:background .15s var(--ease),border-color .15s var(--ease),transform .1s var(--ease)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-hover);text-decoration:none}
.btn.secondary{background:var(--surface);border-color:var(--line-strong);color:var(--ink)}
.btn.secondary:hover{background:var(--surface-2);text-decoration:none}
.btn.quiet{background:transparent;color:var(--accent);padding:0 8px}
.btn.quiet:hover{background:var(--accent-soft);text-decoration:none}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 40%,var(--line-strong));color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:500;color:var(--ink-2)}
.input,select.input{height:38px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);padding:0 10px;min-width:0;width:100%;outline:none}
.input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar{display:grid;grid-template-columns:minmax(220px,2fr) repeat(auto-fit,minmax(140px,1fr));gap:10px;align-items:end}
.toolbar-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:14px 0 10px}
.toggles{display:flex;gap:6px;flex-wrap:wrap}

/* ---------------------------------------------------------------- state chips */
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;line-height:1}
.chip .g{font-size:11px;width:12px;text-align:center}
.st-available{background:var(--ok-soft);color:var(--ok)}
.st-not_available{background:var(--na-soft);color:var(--na)}
.st-ambiguous{background:var(--amb-soft);color:var(--amb)}
.st-blocked{background:var(--blk-soft);color:var(--blk)}
.st-failed{background:var(--fail-soft);color:var(--fail)}
.st-not_applicable{background:var(--napp-soft);color:var(--napp);box-shadow:inset 0 0 0 1px var(--line-strong)}
.f-available{background:var(--ok-fill)}.f-not_available{background:var(--na-fill)}.f-ambiguous{background:var(--amb-fill)}
.f-blocked{background:var(--blk-fill)}.f-failed{background:var(--fail-fill)}
.f-not_applicable{background:repeating-linear-gradient(45deg,var(--napp-fill) 0 2px,transparent 2px 5px);box-shadow:inset 0 0 0 1px var(--napp-fill)}
.tag{display:inline-flex;align-items:center;height:22px;padding:0 7px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap}
.tag.accent{background:var(--accent-soft);color:var(--accent)}
.tag.warn{background:var(--amb-soft);color:var(--amb)}
.tag.bad{background:var(--fail-soft);color:var(--fail)}
.tag.good{background:var(--ok-soft);color:var(--ok)}
.dots{display:grid;grid-template-columns:repeat(13,10px);gap:3px}
.dot{width:10px;height:10px;border-radius:2px}

/* ---------------------------------------------------------------- evidence affordances */
.cite{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;margin-left:3px;border-radius:4px;border:1px solid var(--line-strong);background:var(--surface);font:600 11px/1 var(--mono);color:var(--accent);vertical-align:2px;transition:background .15s var(--ease)}
.cite:hover{background:var(--accent-soft)}
.src{flex:none;display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);border-radius:4px;padding:0 7px;min-height:26px;font-size:12px;color:var(--ink-2);white-space:nowrap;transition:color .15s var(--ease),border-color .15s var(--ease)}
.src:hover{color:var(--accent);border-color:var(--accent)}
.src svg{width:12px;height:12px}
.linkbtn{all:unset;cursor:pointer;color:inherit;border-bottom:1px dashed var(--line-strong);font-variant-numeric:tabular-nums}
.linkbtn:hover{color:var(--accent);border-bottom-color:var(--accent)}
.linkbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------------------------------------------------------------- overview */
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding:28px 0 36px}
.hero h1{font-size:clamp(30px,4.2vw,46px);line-height:1.08;letter-spacing:-.025em;margin:10px 0 14px}
.hero .lede{font-size:16.5px;line-height:1.6;color:var(--ink-2);max-width:58ch;margin:0 0 22px}
.bezel{padding:5px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);max-width:560px}
.bezel form{display:flex;gap:6px;background:var(--surface);border-radius:8px;padding:5px;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.bezel input{flex:1;border:0;background:transparent;outline:none;font-size:16px;padding:0 10px;min-height:42px;min-width:0}
.examples{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;align-items:center}
.examples a{font-size:13px;padding:3px 9px;border-radius:4px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
.examples a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.specimen{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;position:relative}
.specimen .val{font-size:22px;font-weight:620;letter-spacing:-.01em;margin:4px 0 12px;word-break:break-word}
.specimen dl{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin:0;font-size:13px}
.specimen dt{color:var(--ink-3)}.specimen dd{margin:0;word-break:break-word}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.kpi{padding:18px 20px}
.kpi+.kpi{border-left:1px solid var(--line)}
.kpi .v{font-size:26px;font-weight:620;letter-spacing:-.015em;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi .l{color:var(--ink-2);font-size:13px;margin-top:4px}
.trust{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);margin:0 -20px}
.trust>div{padding:16px 20px}
.trust>div+div{border-left:1px solid var(--line)}
.trust .big{font-size:22px;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.trust-list{list-style:none;margin:0;padding:0;display:grid;gap:0}
.trust-list li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.trust-list li:first-child{border-top:0}
.covrow{display:grid;grid-template-columns:minmax(120px,170px) 1fr 108px;gap:12px;align-items:center;padding:6px 0}
.covrow a{color:var(--ink);font-size:13.5px}
.covrow a:hover{color:var(--accent)}
.cbar{position:relative;display:flex;gap:2px;height:12px}
.cbar>span{display:block;height:100%;border-radius:2px;min-width:2px;transform-origin:left;animation:grow .5s var(--ease) both}
.cbar .ci{position:absolute;top:-3px;height:18px;border-left:1.5px solid var(--ink);border-right:1.5px solid var(--ink);pointer-events:none}
.cbar .ci:before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1.5px solid var(--ink)}
.covpct{text-align:right;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.covpct span{color:var(--ink-3);font-size:12px}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:14px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px}
.meter{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:8px 0}
.meter .track{grid-column:1/-1;height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.meter .track span{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:grow .5s var(--ease) both}
.meter.warn .track span{background:var(--amb-fill)}.meter.bad .track span{background:var(--fail-fill)}
.hbar{display:grid;grid-template-columns:minmax(90px,160px) 1fr 70px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .t{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.hbar .t span{display:block;height:100%;background:var(--accent);border-radius:4px;transform-origin:left;animation:grow .5s var(--ease) both}
.hbar .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.checks{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 16px;font-size:13px}
.checks li{display:flex;gap:6px;align-items:baseline}

/* ---------------------------------------------------------------- tables */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tbody tr:last-child td{border-bottom:0}
thead th{position:sticky;top:0;background:var(--surface);font-size:12.5px;font-weight:600;color:var(--ink-2);white-space:nowrap;z-index:1}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono);font-size:13px}
tbody tr:hover{background:var(--surface-2)}
.sortbtn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.sortbtn .ar{color:var(--ink-3);font-size:10px;width:8px}
th[aria-sort] .sortbtn{color:var(--ink)}
.coname{font-weight:600;color:var(--ink)}
.coname:hover{color:var(--accent)}
.sub{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.cv>.sub{display:block}
.filters>summary{cursor:pointer;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:28px}
.filters>summary::-webkit-details-marker{display:none}
.filters>summary:after{content:"+";font:500 18px var(--mono);color:var(--ink-3)}
.filters[open]>summary:after{content:"−"}
.filters[open]>summary{margin-bottom:12px}
.pager{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;flex-wrap:wrap;font-size:13px;color:var(--ink-2)}
.empty{padding:40px 20px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);margin-bottom:6px}
.empty p{max-width:52ch;margin:0 auto 12px}
.skel{background:var(--surface-3);border-radius:6px}

/* ---------------------------------------------------------------- profile */
.profile{display:grid;grid-template-columns:200px minmax(0,1fr);gap:32px;align-items:start}
.toc{position:sticky;top:76px;display:grid;gap:1px;font-size:13px}
.toc button{all:unset;cursor:pointer;padding:6px 10px;border-left:2px solid var(--line);color:var(--ink-2)}
.toc button:hover,.toc button[aria-current="true"]{color:var(--ink);border-left-color:var(--accent)}
.toc button:focus-visible{outline:2px solid var(--accent)}
.cohead{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:start}
.cohead h1{margin:6px 0 4px}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.facts{display:grid;grid-template-columns:repeat(5,1fr);margin:20px -20px -20px;border-top:1px solid var(--line)}
.fact{padding:14px 20px}
.fact+.fact{border-left:1px solid var(--line)}
.fact .v{font-size:19px;font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.01em;line-height:1.25}
.fact .l{font-size:12.5px;color:var(--ink-3);margin-top:2px;display:flex;align-items:center;gap:2px}
.secthead{display:flex;align-items:baseline;gap:10px;margin:36px 0 12px;scroll-margin-top:72px}
.secthead .n{font:600 12px var(--mono);color:var(--ink-3)}
.brief p{margin:0 0 10px;max-width:72ch}
.famhead{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:10px}
.reason{font-size:13px;color:var(--ink-2);margin:0}
dl.kv{display:grid;grid-template-columns:minmax(110px,32%) minmax(0,1fr);margin:0}
dl.kv dt,dl.kv dd{padding:9px 0;border-top:1px solid var(--line);margin:0}
dl.kv dt:first-of-type,dl.kv dd:first-of-type{border-top:0}
dl.kv dt{color:var(--ink-2);font-size:13.5px;padding-right:12px}
dl.kv dd{display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:flex-start;min-width:0}
dl.kv dd>span:first-child{flex:1 1 16ch;min-width:0;overflow-wrap:break-word}
.rows{display:grid}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .t{font-weight:550}
.row>div:first-child{min-width:0;overflow-wrap:break-word}
.signal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:12px 0;border-top:1px solid var(--line)}
.signal:first-child{border-top:0}
.sig-ico{width:24px;height:24px;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.strip{display:flex;flex-wrap:wrap;gap:6px}
.charts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.chart{border:1px solid var(--line);border-radius:8px;padding:12px 12px 6px}
.chart h4{margin:0;font-size:13px;font-weight:600}
.chart .cu{font-size:12px;color:var(--ink-3)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .bar{cursor:pointer;transition:opacity .15s var(--ease)}
.chart g.pt:hover .bar,.chart g.pt:focus .bar{opacity:.78}
.chart g.pt:focus{outline:none}
.chart g.pt:focus-visible .hit{stroke:var(--accent);stroke-width:2}
.chart text{font:11px var(--sans);fill:var(--ink-3)}
.chart text.lbl{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.tl{position:relative;display:flex;gap:0;overflow-x:auto;padding:6px 0 4px}
.tl .node{flex:1 0 84px;position:relative;padding-top:22px;text-align:center;font-size:13px}
.tl .node:before{content:"";position:absolute;top:8px;left:0;right:0;border-top:1.5px solid var(--line-strong)}
.tl .node:first-child:before{left:50%}.tl .node:last-child:before{right:50%}
.tl .node:after{content:"";position:absolute;top:3px;left:50%;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.tl .node a{font-weight:600;font-variant-numeric:tabular-nums}
.vtl{position:relative;margin-left:6px;padding-left:18px;border-left:1.5px solid var(--line-strong)}
.vtl .ev{position:relative;padding:4px 0 12px}
.vtl .ev:before{content:"";position:absolute;left:-23.5px;top:11px;width:9px;height:9px;border-radius:50%;background:var(--surface);border:2px solid var(--accent)}
.map{position:relative;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);margin-bottom:12px;overflow:hidden}
.map svg{display:block;width:100%;height:auto}
.map circle{fill:var(--accent);stroke:var(--surface);stroke-width:1.5}
.map .grid line{stroke:var(--line-strong);stroke-width:.5}
.map .note{position:absolute;left:10px;bottom:8px;font-size:11.5px;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:2px 6px;border-radius:4px}
.foot{margin-top:32px;font-size:12.5px;color:var(--ink-3)}

/* ---------------------------------------------------------------- compare / changes / method */
.cmp td,.cmp th{min-width:170px}
.cmp td:first-child,.cmp th:first-child{min-width:150px;color:var(--ink-2);font-size:13px;position:sticky;left:0;background:var(--surface);z-index:1}
.cmp tr.diff td:not(:first-child){background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cmp .chead{display:flex;justify-content:space-between;gap:6px;align-items:flex-start}
.chg{display:grid;grid-template-columns:96px 1fr auto;gap:14px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.chg:first-child{border-top:0}
.chg .d{font:12.5px var(--mono);color:var(--ink-3);padding-top:2px}
.delta{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.delta s{color:var(--ink-3)}
.steps{list-style:none;margin:0;padding:0;counter-reset:s;display:grid;gap:0}
.steps li{counter-increment:s;display:grid;grid-template-columns:32px 1fr;gap:12px;padding:10px 0;position:relative}
.steps li:before{content:counter(s);width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);font:600 12px var(--mono);display:flex;align-items:center;justify-content:center;background:var(--surface);z-index:1}
.steps li:not(:last-child):after{content:"";position:absolute;left:13px;top:36px;bottom:-10px;border-left:1.5px solid var(--line-strong)}
.steps b{display:block;font-weight:600}
.steps span{font-size:13.5px;color:var(--ink-2)}
.keys{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;align-items:center;font-size:14px;margin:0}
.keys dd{margin:0}

/* ---------------------------------------------------------------- typeahead */
.ta{position:absolute;left:0;right:0;top:calc(100% + 4px);list-style:none;margin:0;padding:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow-overlay);z-index:var(--z-pop);max-height:360px;overflow:auto}
.ta[hidden]{display:none}
.ta li{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:5px;cursor:pointer;font-size:14px}
.ta li[aria-selected="true"],.ta li:hover{background:var(--accent-soft)}
.ta li .o{font:12px var(--mono);color:var(--ink-3);white-space:nowrap}
.ta li.none{color:var(--ink-3);cursor:default;background:none}
.rel{position:relative}

/* ---------------------------------------------------------------- drawer */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.32);z-index:var(--z-scrim);opacity:0;pointer-events:none;transition:opacity .2s var(--ease)}
.scrim.open{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100dvh;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--shadow-overlay);transform:translateX(104%);transition:transform .22s var(--ease);z-index:var(--z-drawer);display:flex;flex-direction:column;visibility:hidden}
#drawer.open{transform:none;visibility:visible}
#drawer header{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line)}
#drawer header strong{font-size:15px;font-weight:600}
#drawer .body{overflow:auto;padding:18px 20px 28px;overscroll-behavior:contain}
.grab{display:none}
.evclaim .v{font-size:18px;font-weight:620;margin:4px 0 6px;overflow-wrap:anywhere}
.evitem{border:1px solid var(--line);border-radius:8px;padding:14px;margin-top:14px}
.span{font:12.5px/1.55 var(--mono);background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 12px;border-radius:4px;white-space:pre-wrap;word-break:break-word;margin:10px 0}
.evrow{display:grid;grid-template-columns:100px 1fr;gap:8px;font-size:13px;padding:5px 0;border-top:1px solid var(--line)}
.evrow>span:first-child{color:var(--ink-3)}
.evrow>span:last-child,.evrow>a{overflow-wrap:anywhere;min-width:0}
.hash{display:flex;gap:8px;align-items:flex-start}
.hash code{font:11.5px/1.5 var(--mono);word-break:break-all;color:var(--ink-2)}
#tip{position:fixed;z-index:var(--z-toast);pointer-events:none;background:var(--ink);color:var(--canvas);font-size:12.5px;padding:6px 9px;border-radius:5px;max-width:260px;opacity:0;transition:opacity .1s;font-variant-numeric:tabular-nums}
#tip.on{opacity:1}
.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,8px);background:var(--ink);color:var(--canvas);padding:9px 14px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s var(--ease),transform .2s var(--ease);z-index:var(--z-toast);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------------------------------------------------------------- glass layer (DESIGN.md §2b) */
body{background:var(--canvas);isolation:isolate}
body:before{content:"";position:fixed;inset:-12%;z-index:-1;pointer-events:none;
  background:radial-gradient(38% 34% at 10% 6%,var(--amb-1),transparent 70%),radial-gradient(34% 30% at 92% 14%,var(--amb-2),transparent 70%),
    radial-gradient(44% 40% at 72% 96%,var(--amb-3),transparent 72%),radial-gradient(30% 28% at 18% 78%,var(--amb-2),transparent 70%)}
.panel,.kpis,.specimen,.tablewrap,.chart,.bezel{background:var(--glass);border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-radius:14px}
.chart{background:color-mix(in srgb,var(--glass) 60%,transparent);box-shadow:none}
.top{background:var(--glass-strong);border-bottom:1px solid var(--glass-border);box-shadow:0 6px 24px -18px rgba(31,74,107,.35)}
#drawer,.ta{background:var(--glass-strong);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border-color:var(--glass-border)}
.kpi .v,.trust .big{background:linear-gradient(180deg,var(--ink),color-mix(in srgb,var(--ink) 70%,var(--accent)));-webkit-background-clip:text;background-clip:text;color:transparent}
.btn.primary{box-shadow:0 6px 16px -8px color-mix(in srgb,var(--accent) 70%,transparent)}
.examples a,.src,.cite,.input,.searchbox input,.seg,.iconbtn,.btn.secondary{background:color-mix(in srgb,var(--surface) 78%,transparent)}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 55%,transparent)}
thead th{background:color-mix(in srgb,var(--surface) 88%,transparent)}
.panel:hover{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 16px 36px -16px rgba(31,74,107,.28),0 2px 6px -3px rgba(31,74,107,.10)}
@media (prefers-reduced-transparency:reduce){.panel,.kpis,.specimen,.tablewrap,.chart,.bezel,.top,#drawer,.ta{background:var(--surface);-webkit-backdrop-filter:none;backdrop-filter:none}}
/* charts */
.viz-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:16px;align-items:start}
.donut-wrap{display:grid;grid-template-columns:180px 1fr;gap:20px;align-items:center}
.donut{display:block;width:180px;height:180px}
.donut circle.track{fill:none;stroke:var(--surface-2);stroke-width:22}
.donut circle.seg{fill:none;stroke-width:22;transition:stroke-width .15s var(--ease);cursor:default}
.donut circle.seg:hover{stroke-width:26}
.donut .c1{font:650 26px var(--sans);fill:var(--ink);letter-spacing:-.02em}
.donut .c2{font:500 11.5px var(--sans);fill:var(--ink-3)}
.sw-available{stroke:var(--ok-fill)}.sw-not_available{stroke:var(--na-fill)}.sw-ambiguous{stroke:var(--amb-fill)}.sw-blocked{stroke:var(--blk-fill)}.sw-failed{stroke:var(--fail-fill)}.sw-not_applicable{stroke:var(--napp-fill)}
.dlegend{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:13px}
.dlegend li{display:grid;grid-template-columns:12px 1fr auto auto;gap:8px;align-items:center}
.dlegend i{width:12px;height:12px;border-radius:3px}
.dlegend .n{font-variant-numeric:tabular-nums;color:var(--ink-2)}.dlegend .p{font-variant-numeric:tabular-nums;color:var(--ink-3);min-width:44px;text-align:right}
.cols svg{display:block;width:100%;height:auto;overflow:visible}
.cols rect.col{fill:var(--accent);transition:opacity .15s var(--ease)}
.cols g:hover rect.col{opacity:.78}
.cols text{font:11.5px var(--sans);fill:var(--ink-3)}
.cols text.v{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:7px}
.bars .b{display:grid;grid-template-columns:minmax(90px,38%) 1fr 56px;gap:10px;align-items:center;font-size:13px}
.bars .b>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .t{height:10px;border-radius:5px;background:color-mix(in srgb,var(--surface-2) 80%,transparent);overflow:hidden}
.bars .t span{display:block;height:100%;border-radius:5px;background:var(--accent);transform-origin:left;animation:grow .55s var(--ease) both}
.bars .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.ring{display:flex;align-items:center;gap:10px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--surface-2)}.ring .fg{stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s var(--ease)}
.ring b{display:block;font-size:18px;font-weight:650;font-variant-numeric:tabular-nums;line-height:1.1}
.ring small{font-size:12px;color:var(--ink-3)}
.cmpcharts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-bottom:16px}
.hb svg{display:block;width:100%;height:auto;overflow:visible}
.hb text{font:11.5px var(--sans);fill:var(--ink-2)}
.hb text.v{fill:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.ckey{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:0}
.k1{background:var(--s1)}.k2{background:var(--s2)}.k3{background:var(--s3)}.k4{background:var(--s4)}

/* integrated terminal (home page: run it locally) */
.term-panel{margin-top:16px;border-radius:14px;overflow:hidden;background:rgba(17,24,31,.90);border:1px solid rgba(255,255,255,.10);
  box-shadow:0 18px 40px -18px rgba(17,24,31,.55),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);color:#E6EDF3}
.term-bar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04)}
.term-bar i{width:11px;height:11px;border-radius:50%;display:inline-block}
.term-bar i:nth-child(1){background:#FF5F57}.term-bar i:nth-child(2){background:#FEBC2E}.term-bar i:nth-child(3){background:#28C840}
.term-bar strong{font:600 12.5px var(--mono);color:#9FB0C0;margin-left:6px}
.term-bar .grow{flex:1}
.term-bar button,.term-bar a{font:600 12px var(--sans);color:#E6EDF3;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:6px;padding:5px 10px;min-height:28px;text-decoration:none}
.term-bar button:hover,.term-bar a:hover{background:rgba(255,255,255,.16)}
.term-body{padding:12px 0 14px;font:13px/1.65 var(--mono);overflow-x:auto}
.term-step{display:grid;grid-template-columns:28px 1fr auto;gap:8px;align-items:start;padding:3px 14px}
.term-step:hover{background:rgba(255,255,255,.04)}
.term-step .k{color:#5C6B7A;text-align:right;user-select:none}
.term-step .c{color:#7EE787}.term-step .c:before{content:"$ ";color:#58A6FF}
.term-step .note{display:block;color:#8B9AAA;font-size:12px}
.term-step button{opacity:0;font:600 11px var(--sans);color:#C9D6E2;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:5px;padding:2px 8px;min-height:24px;transition:opacity .15s var(--ease)}
.term-step:hover button,.term-step button:focus-visible{opacity:1}
@media (pointer:coarse){.term-step button{opacity:1;min-height:36px}}
.term-step .run{opacity:1;background:rgba(88,166,255,.18);border-color:rgba(88,166,255,.45);color:#CFE3FF;margin-right:4px}
.ps{border-top:1px solid rgba(255,255,255,.10);background:#012456;font:13px/1.55 "Cascadia Mono","Cascadia Code",Consolas,var(--mono);color:#EEEDF0}
.ps-head{display:flex;align-items:center;gap:8px;padding:6px 12px;background:rgba(0,0,0,.25);font:600 12px var(--sans);color:#C9D6E2}
.ps-head .dot{width:8px;height:8px;border-radius:50%;background:#5C6B7A}.ps-head .dot.live{background:#28C840}.ps-head .dot.busy{background:#FEBC2E;animation:pulse 1s infinite}
.ps-head .grow{flex:1}
.ps-head button{font:600 11.5px var(--sans);color:#EEEDF0;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:5px;padding:2px 8px;min-height:24px}
.ps-out{height:300px;overflow:auto;padding:10px 14px 4px;white-space:pre-wrap;word-break:break-word;overscroll-behavior:contain}
.ps-out .p{color:#EEEDF0}.ps-out .p b{color:#F9F1A5;font-weight:400}
.ps-out .ok{color:#7EE787}.ps-out .warn{color:#F9F1A5}.ps-out .bad{color:#FF7B72}.ps-out .dim{color:#8FA3B8}.ps-out .tg{color:#61D6D6}
.ps-out a{color:#79C0FF}
.ps-in{display:flex;align-items:center;gap:0;padding:2px 14px 12px}
.ps-in label{color:#EEEDF0;white-space:nowrap}
.ps-in input{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#EEEDF0;font:inherit;caret-color:#EEEDF0;padding:2px 0 2px 6px}
@keyframes pulse{50%{opacity:.3}}

/* ---------------------------------------------------------------- responsive */
@media (max-width:1100px){
  .profile{grid-template-columns:1fr}.toc{display:none}
  .charts{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){
  .viz-grid,.cmpcharts{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;gap:24px}
  .split,.grid2{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr 1fr}.kpi:nth-child(3){border-left:0}.kpi:nth-child(n+3){border-top:1px solid var(--line)}
  .trust{grid-template-columns:1fr}.trust>div+div{border-left:0;border-top:1px solid var(--line)}
  .facts{grid-template-columns:repeat(3,1fr)}.fact:nth-child(4){border-left:0}.fact:nth-child(n+4){border-top:1px solid var(--line)}
}
@media (max-width:760px){
  .top-in{flex-wrap:wrap;padding:8px 16px;gap:8px 10px}
  nav.tabs{order:3;flex:1 1 100%;overflow-x:auto;margin:0 -16px;padding:0 10px;min-height:44px;scrollbar-width:none}
  nav.tabs::-webkit-scrollbar{display:none}
  .searchbox{order:4;flex:1 1 100%}
  .searchbox kbd{display:none}
  main{padding:20px 16px 80px}
  .panel{padding:16px}
  .trust,.facts{margin-left:-16px;margin-right:-16px}
  .facts{margin-bottom:-16px;grid-template-columns:1fr 1fr}.fact{padding:12px 16px}
  .fact:nth-child(n){border-left:0;border-top:1px solid var(--line)}.fact:nth-child(even){border-left:1px solid var(--line)}
  .facts .fact:nth-child(-n+2){border-top:0}
  .facts .fact:last-child:nth-child(odd){grid-column:1/-1;border-left:0}
  .trust>div{padding:14px 16px}
  .cohead{grid-template-columns:1fr}.actions{justify-content:flex-start}
  .charts{grid-template-columns:1fr}
  .covrow{grid-template-columns:1fr 92px;gap:4px 10px}.covrow .cbar{grid-column:1/-1;grid-row:2}
  dl.kv{grid-template-columns:1fr}dl.kv dt{border-top:1px solid var(--line);padding-bottom:0}dl.kv dd{border-top:0;padding-top:2px}
  dl.kv dt:first-of-type{border-top:0}
  .checks{grid-template-columns:1fr}
  .chg{grid-template-columns:1fr auto}.chg .d{grid-column:1/-1}
  .toolbar{grid-template-columns:1fr 1fr}.toolbar .field:first-child{grid-column:1/-1}
  .tablewrap.resp{border:0;background:transparent;overflow:visible}
  table.resp thead{display:none}
  table.resp tr{display:block;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--surface);padding:6px 2px}
  table.resp td{display:flex;justify-content:space-between;gap:12px;border:0;padding:5px 12px;text-align:right}
  table.resp td:before{content:attr(data-l);color:var(--ink-3);font-size:12.5px;text-align:left;font-family:var(--sans)}
  table.resp td.first{display:block;text-align:left}table.resp td.first:before{content:none}
  table.resp tr:hover{background:var(--surface)}
  table.resp .cv>.sub{display:inline;margin-left:6px}
  #drawer{top:auto;bottom:0;height:88dvh;width:100%;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(104%)}
  #drawer.open{transform:none}
  .grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--line-strong);margin:8px auto 0}
  .hero{padding-top:8px}

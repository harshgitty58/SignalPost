name: clean-machine
on: [push, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run --group dev pytest -q
      - name: live smoke (5 companies)
        run: |
          printf '{"organisation_number":"923609016"}\n{"organisation_number":"947942638"}\n{"organisation_number":"996756246"}\n{"organisation_number":"914778271"}\n{"organisation_number":"000000000"}\n' > ci-batch.jsonl
          uv run signalpost run --organisations ci-batch.jsonl --out out-ci --job-days 2
          test "$(wc -l < out-ci/envelopes.jsonl)" -eq 5
